name: Check flights

on:
  schedule:
    - cron: "13 * * * *" # backup only: GitHub's cron is unreliable; the `next` job is the main timer
  workflow_dispatch:

permissions:
  contents: write # commit alerted.json (prevents duplicate alerts)
  actions: write # start the next run

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: check-flights
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python check_flights.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_ADMIN_TOPIC: ${{ secrets.NTFY_ADMIN_TOPIC }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MAX_PRICE: ${{ vars.MAX_PRICE }}
          NEAR_PRICE: ${{ vars.NEAR_PRICE }}
          END_DATE: ${{ vars.END_DATE }}
          DIGEST: ${{ vars.DIGEST }}
      - name: Push a notice if the run crashed
        if: failure()
        env:
          TOPIC: ${{ secrets.NTFY_ADMIN_TOPIC || secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS --retry 3 \
            -H "Title: Flight checker crashed" \
            -H "Priority: 4" \
            -H "Click: $RUN_URL" \
            -H "Actions: view, Open the logs, $RUN_URL" \
            -d "The last run stopped with an error, so it may have missed fares. It will try again within the hour." \
            "https://ntfy.sh/$TOPIC"
      - name: Save alert state
        if: always()
        run: |
          if [ -n "$(git status --porcelain alerted.json)" ]; then
            git config user.name "flight-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add alerted.json
            git commit -m "Update alert state"
            git pull --rebase -q || true
            git push
          fi

  next:
    # The `hourly` environment has a wait timer, so this job starts about an hour
    # after `check` finishes. Waiting uses no runner minutes. Then it starts the next run.
    needs: check
    if: always()
    runs-on: ubuntu-latest
    environment: hourly
    timeout-minutes: 5
    steps:
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TOPIC: ${{ secrets.NTFY_ADMIN_TOPIC || secrets.NTFY_TOPIC }}
          RUN_ID: ${{ github.run_id }}
        run: |
          newest=$(gh run list --workflow check.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ "$newest" != "$RUN_ID" ]; then
            echo "Run $newest is newer and will continue the chain."
            exit 0
          fi
          for i in 1 2 3 4 5; do
            if gh workflow run check.yml --ref main; then exit 0; fi
            sleep 30
          done
          curl -sS --retry 3 -H "Title: Flight checker stopped" -H "Priority: 4" \
            -d "It could not schedule its next run. Restart it with: gh workflow run check.yml -R $GH_REPO" \
            "https://ntfy.sh/$TOPIC"
          exit 1
